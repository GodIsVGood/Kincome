<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>פנקס משותף</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1C2541">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f5f4f0; }
  #root { height: 100vh; height: 100dvh; }
  .mono { font-variant-numeric: tabular-nums; font-family: 'Consolas', monospace; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ===================================================================
   שלב הקמה חובה: הדבק כאן את פרטי פרויקט ה-Firebase שלך
   (מתקבלים מ-console.firebase.google.com אחרי יצירת פרויקט ואפליקציית Web)
   =================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBvFzm3YnSZgimvsFWzT3sM7Lg2kxguCao",
  authDomain: "kess-income.firebaseapp.com",
  projectId: "kess-income",
  storageBucket: "kess-income.firebasestorage.app",
  messagingSenderId: "802375702998",
  appId: "1:802375702998:web:2eedaa18d55e5a7f812c77"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

const DEFAULT_CATEGORIES = {
  income: ['משכורת', 'עמלות', 'אחר'],
  expense: ['דיור', 'מזון', 'תחבורה', 'בריאות', 'בילויים', 'תשלומים ומיסים', 'אחר'],
};
const KEYWORD_MAP = [
  [['סופר', 'קניות', 'שופרסל', 'רמי לוי', 'ויקטורי', 'אושר עד'], 'מזון'],
  [['דלק', 'פנגו', 'חניה', 'אוטובוס', 'רכבת', 'מונית', 'אגד'], 'תחבורה'],
  [['שכירות', 'ארנונה', 'ועד בית', 'חשמל', 'מים', 'גז'], 'דיור'],
  [['רופא', 'תרופות', 'קופת חולים', 'שיניים'], 'בריאות'],
  [['מסעדה', 'קפה', 'בילוי', 'סרט', 'בר '], 'בילויים'],
  [['ביטוח לאומי', 'מס הכנסה', 'מע"מ', 'אגרה'], 'תשלומים ומיסים'],
];
const INCOME_WORDS = ['משכורת', 'שכר', 'הכנסה', 'קיבלתי', 'קיבלנו', 'החזר', 'בונוס'];
const NAME_KEY = 'panekes-display-name';

function todayISO() { return new Date().toISOString().slice(0, 10); }
function currentMonth() { return new Date().toISOString().slice(0, 7); }
function fmt(n) { return new Intl.NumberFormat('he-IL', { maximumFractionDigits: 0 }).format(Math.round(n)); }

function guessCategory(desc, type) {
  if (type === 'income') return 'אחר';
  const d = desc.toLowerCase();
  for (const [words, cat] of KEYWORD_MAP) if (words.some(w => d.includes(w))) return cat;
  return 'אחר';
}
function parseEntry(raw) {
  const text = raw.trim();
  const m = text.match(/^([+\-])?\s*([\d,.]+)\s*(.*)$/);
  if (!m) return null;
  const amount = parseFloat(m[2].replace(/,/g, ''));
  if (!amount || amount <= 0) return null;
  let desc = (m[3] || '').trim() || 'ללא תיאור';
  let type = m[1] === '+' ? 'income' : 'expense';
  if (INCOME_WORDS.some(w => desc.includes(w))) type = 'income';
  return { amount, desc, type, category: guessCategory(desc, type) };
}

function App() {
  const [displayName, setDisplayName] = useState(() => localStorage.getItem(NAME_KEY) || '');
  const [nameInput, setNameInput] = useState('');
  const [transactions, setTransactions] = useState([]);
  const [config, setConfig] = useState({ budgets: {}, categories: DEFAULT_CATEGORIES });
  const [tab, setTab] = useState('feed');
  const [entry, setEntry] = useState('');
  const [month, setMonth] = useState(currentMonth());
  const [newCat, setNewCat] = useState('');
  const [connError, setConnError] = useState(false);
  const feedEndRef = useRef(null);
  const monthlyChartRef = useRef(null);
  const categoryChartRef = useRef(null);
  const monthlyChartInstance = useRef(null);
  const categoryChartInstance = useRef(null);

  useEffect(() => {
    const unsubTx = db.collection('transactions').orderBy('ts', 'asc').onSnapshot(
      (snap) => { setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() }))); setConnError(false); },
      () => setConnError(true)
    );
    const unsubCfg = db.collection('config').doc('shared').onSnapshot(
      (doc) => { if (doc.exists) setConfig(doc.data()); },
      () => setConnError(true)
    );
    return () => { unsubTx(); unsubCfg(); };
  }, []);

  useEffect(() => {
    if (feedEndRef.current) feedEndRef.current.scrollIntoView({ behavior: 'smooth' });
  }, [transactions, tab]);

  function saveName(name) {
    localStorage.setItem(NAME_KEY, name);
    setDisplayName(name);
  }

  function submitEntry(e) {
    e.preventDefault();
    const parsed = parseEntry(entry);
    if (!parsed) return;
    db.collection('transactions').add({ ...parsed, author: displayName, date: todayISO(), ts: Date.now() })
      .catch(() => setConnError(true));
    setEntry('');
  }
  function deleteTx(id) {
    db.collection('transactions').doc(id).delete().catch(() => setConnError(true));
  }
  function updateBudget(cat, val) {
    const n = parseFloat(val);
    const next = { ...config, budgets: { ...config.budgets, [cat]: isNaN(n) ? 0 : n } };
    db.collection('config').doc('shared').set(next).catch(() => setConnError(true));
  }
  function addCategory() {
    const name = newCat.trim();
    if (!name || config.categories.expense.includes(name)) return;
    const next = { ...config, categories: { ...config.categories, expense: [...config.categories.expense, name] } };
    db.collection('config').doc('shared').set(next).catch(() => setConnError(true));
    setNewCat('');
  }
  function removeCategory(name) {
    const next = { ...config, categories: { ...config.categories, expense: config.categories.expense.filter(c => c !== name) } };
    db.collection('config').doc('shared').set(next).catch(() => setConnError(true));
  }

  const monthTx = useMemo(() => transactions.filter(t => t.date.slice(0,7) === month), [transactions, month]);
  const totals = useMemo(() => {
    const income = monthTx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
    const expense = monthTx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
    return { income, expense, balance: income - expense };
  }, [monthTx]);
  const spentByCategory = useMemo(() => {
    const map = {};
    monthTx.filter(t => t.type === 'expense').forEach(t => { map[t.category] = (map[t.category] || 0) + t.amount; });
    return map;
  }, [monthTx]);

  const lastSixMonths = useMemo(() => {
    const months = [];
    const d = new Date();
    for (let i = 5; i >= 0; i--) {
      const dt = new Date(d.getFullYear(), d.getMonth() - i, 1);
      months.push(dt.toISOString().slice(0, 7));
    }
    return months.map(m => {
      const tx = transactions.filter(t => t.date.slice(0,7) === m);
      const income = tx.filter(t => t.type === 'income').reduce((s,t) => s + t.amount, 0);
      const expense = tx.filter(t => t.type === 'expense').reduce((s,t) => s + t.amount, 0);
      return { month: m, income, expense };
    });
  }, [transactions]);

  const spendByPerson = useMemo(() => {
    const map = {};
    monthTx.filter(t => t.type === 'expense').forEach(t => { map[t.author] = (map[t.author] || 0) + t.amount; });
    return map;
  }, [monthTx]);

  useEffect(() => {
    if (tab !== 'analysis' || !window.Chart) return;
    if (monthlyChartInstance.current) monthlyChartInstance.current.destroy();
    if (categoryChartInstance.current) categoryChartInstance.current.destroy();

    if (monthlyChartRef.current) {
      monthlyChartInstance.current = new Chart(monthlyChartRef.current, {
        type: 'bar',
        data: {
          labels: lastSixMonths.map(m => m.month.slice(5) + '/' + m.month.slice(2,4)),
          datasets: [
            { label: 'הכנסות', data: lastSixMonths.map(m => m.income), backgroundColor: '#0B6E4F' },
            { label: 'הוצאות', data: lastSixMonths.map(m => m.expense), backgroundColor: '#C1440E' },
          ],
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', rtl: true, labels: { font: { family: 'Segoe UI' } } } }, scales: { x: { reverse: true } } },
      });
    }
    if (categoryChartRef.current) {
      const labels = Object.keys(spentByCategory);
      const values = Object.values(spentByCategory);
      categoryChartInstance.current = new Chart(categoryChartRef.current, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{ data: values, backgroundColor: ['#1C2541','#0B6E4F','#C1440E','#C08A00','#5B6470','#8A6DAB','#3A7CA5'] }],
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom', rtl: true, labels: { font: { family: 'Segoe UI' } } } } },
      });
    }
    return () => {
      if (monthlyChartInstance.current) monthlyChartInstance.current.destroy();
      if (categoryChartInstance.current) categoryChartInstance.current.destroy();
    };
  }, [tab, lastSixMonths, spentByCategory]);

  if (!displayName) {
    return (
      <div dir="rtl" style={{height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background:'#f5f4f0', padding:'0 24px', boxSizing:'border-box'}}>
        <div style={{background:'#fff', border:'1px solid #d6d3d1', borderRadius:8, padding:24, width:'100%', maxWidth:320, textAlign:'center'}}>
          <div style={{fontSize:28, marginBottom:8}}>💬</div>
          <h1 style={{fontWeight:700, fontSize:18, marginBottom:4, color:'#1C2541'}}>פנקס משותף</h1>
          <p style={{fontSize:14, color:'#78716c', marginBottom:16}}>איך לקרוא לך ביומן המשותף?</p>
          <form onSubmit={e => { e.preventDefault(); if (nameInput.trim()) saveName(nameInput.trim()); }}>
            <input autoFocus value={nameInput} onChange={e => setNameInput(e.target.value)} placeholder="לדוגמה: יוסי"
              style={{width:'100%', border:'1px solid #d6d3d1', borderRadius:6, padding:'8px 12px', fontSize:14, marginBottom:12, textAlign:'center', boxSizing:'border-box'}} />
            <button type="submit" style={{width:'100%', padding:'8px 0', borderRadius:6, color:'#fff', background:'#1C2541', border:'none', fontWeight:600}}>המשך</button>
          </form>
        </div>
      </div>
    );
  }

  return (
    <div dir="rtl" style={{height:'100%', display:'flex', flexDirection:'column', background:'#f5f4f0', color:'#292524', overflow:'hidden'}}>
      <header style={{borderBottom:'1px solid #d6d3d1', background:'rgba(250,250,249,0.95)', position:'sticky', top:0, zIndex:10}}>
        <div style={{maxWidth:640, margin:'0 auto', padding:'12px 16px', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
          <div>
            <h1 style={{fontWeight:700, fontSize:16, color:'#1C2541', margin:0}}>פנקס משותף</h1>
            <p style={{fontSize:11, color:'#a8a29e', margin:0}}>מחובר בתור {displayName}</p>
          </div>
          <div style={{textAlign:'left'}}>
            <div style={{fontSize:11, color:'#a8a29e'}}>מאזן {month.slice(5)}/{month.slice(0,4)}</div>
            <div className="mono" style={{fontWeight:700, color: totals.balance >= 0 ? '#0B6E4F' : '#C1440E'}}>₪{fmt(totals.balance)}</div>
          </div>
        </div>
        <nav style={{maxWidth:640, margin:'0 auto', padding:'0 16px', display:'flex', gap:4}}>
          {[['feed','יומן'],['budget','תקציב'],['analysis','ניתוח']].map(([key,label]) => (
            <button key={key} onClick={() => setTab(key)} style={{
              padding:'8px 12px', fontSize:14, fontWeight:500, background:'none', border:'none', borderBottom: tab===key ? '2px solid #1C2541' : '2px solid transparent',
              color: tab===key ? '#1C2541' : '#78716c', cursor:'pointer'
            }}>{label}</button>
          ))}
        </nav>
      </header>

      {connError && (
        <div style={{maxWidth:640, margin:'0 auto', width:'100%', padding:'8px 16px 0'}}>
          <div style={{fontSize:12, color:'#92400e', background:'#fffbeb', border:'1px solid #fde68a', borderRadius:6, padding:'6px 12px'}}>
            אין חיבור לשרת הנתונים. בדוק שהגדרת נכון את פרטי Firebase, ושיש חיבור לאינטרנט
          </div>
        </div>
      )}

      {tab === 'feed' && (
        <React.Fragment>
          <div style={{flex:1, overflowY:'auto', maxWidth:640, margin:'0 auto', width:'100%', padding:'16px', boxSizing:'border-box'}}>
            {monthTx.length === 0 && <p style={{fontSize:14, color:'#a8a29e', textAlign:'center', padding:'32px 0'}}>אין תנועות החודש. כתבו למטה, למשל "150 סופר"</p>}
            {monthTx.map(t => {
              const isMe = t.author === displayName;
              return (
                <div key={t.id} style={{
                  borderRadius:8, padding:'8px 12px', border:'1px solid', maxWidth:'85%', marginBottom:8,
                  marginRight: isMe ? 0 : 'auto', marginLeft: isMe ? 'auto' : 0,
                  background: isMe ? '#EAF3EF' : '#fff', borderColor: isMe ? '#0B6E4F55' : '#e7e5e4'
                }}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:12}}>
                    <div>
                      <div style={{fontSize:14}}>{t.desc}</div>
                      <div style={{fontSize:11, color:'#a8a29e', marginTop:2}}>{t.author} · {t.category} · {t.date.slice(5)}</div>
                    </div>
                    <div style={{display:'flex', alignItems:'center', gap:8, flexShrink:0}}>
                      <span className="mono" style={{fontWeight:600, fontSize:14, color: t.type==='income' ? '#0B6E4F' : '#C1440E'}}>
                        {t.type==='income' ? '+' : '-'}₪{fmt(t.amount)}
                      </span>
                      <button onClick={() => deleteTx(t.id)} style={{border:'none', background:'none', color:'#d6d3d1', cursor:'pointer'}}>✕</button>
                    </div>
                  </div>
                </div>
              );
            })}
            <div ref={feedEndRef} />
          </div>
          <form onSubmit={submitEntry} style={{borderTop:'1px solid #d6d3d1', background:'#fafaf9', padding:'12px 16px', display:'flex', gap:8, maxWidth:640, margin:'0 auto', width:'100%', boxSizing:'border-box'}}>
            <input value={entry} onChange={e => setEntry(e.target.value)} placeholder='למשל: 150 סופר, או +5000 משכורת'
              style={{flex:1, border:'1px solid #d6d3d1', borderRadius:999, padding:'8px 16px', fontSize:14}} />
            <button type="submit" aria-label="שלח" style={{width:40, height:40, borderRadius:'50%', color:'#fff', background:'#1C2541', border:'none', flexShrink:0, cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center'}}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{transform:'scaleX(-1)'}}>
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </form>
        </React.Fragment>
      )}

      {tab === 'budget' && (
        <div style={{flex:1, overflowY:'auto', maxWidth:640, margin:'0 auto', width:'100%', padding:'16px', boxSizing:'border-box'}}>
          <h2 style={{fontSize:13, fontWeight:600, color:'#78716c', marginBottom:12, textTransform:'uppercase', letterSpacing:0.5}}>תקציב חודשי לפי קטגוריה</h2>
          {config.categories.expense.map(c => {
            const spent = spentByCategory[c] || 0;
            const budget = config.budgets[c] || 0;
            const over = budget > 0 && spent > budget;
            return (
              <div key={c} style={{background:'#fff', border:'1px solid #e7e5e4', borderRadius:6, padding:'8px 16px', marginBottom:8}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                  <div style={{display:'flex', alignItems:'center', gap:8}}>
                    <span style={{fontSize:14}}>{c}</span>
                    <button onClick={() => removeCategory(c)} style={{border:'none', background:'none', color:'#d6d3d1', cursor:'pointer'}}>✕</button>
                  </div>
                  <div className="mono" style={{fontSize:14, display:'flex', alignItems:'center', gap:4}}>
                    <span style={{color:'#a8a29e'}}>₪</span>
                    <input type="number" defaultValue={config.budgets[c] || ''} onBlur={e => updateBudget(c, e.target.value)}
                      placeholder="0" style={{width:96, textAlign:'left', border:'1px solid #e7e5e4', borderRadius:4, padding:'4px 8px'}} />
                  </div>
                </div>
                {budget > 0 && (
                  <div style={{marginTop:6, fontSize:12, color: over ? '#C1440E' : '#78716c'}}>
                    השתמשתם ב־₪{fmt(spent)} מתוך ₪{fmt(budget)} החודש
                  </div>
                )}
              </div>
            );
          })}
          <div style={{display:'flex', gap:8, marginTop:12}}>
            <input value={newCat} onChange={e => setNewCat(e.target.value)} placeholder="קטגוריה חדשה"
              style={{flex:1, border:'1px solid #d6d3d1', borderRadius:6, padding:'6px 12px', fontSize:14}} />
            <button onClick={addCategory} style={{padding:'6px 12px', color:'#fff', background:'#1C2541', border:'none', borderRadius:6, fontSize:14, cursor:'pointer'}}>הוסף</button>
          </div>
          <div style={{marginTop:24}}>
            <label style={{fontSize:14, color:'#78716c'}}>חודש לצפייה</label>
            <input type="month" value={month} onChange={e => setMonth(e.target.value)}
              className="mono" style={{display:'block', marginTop:4, border:'1px solid #d6d3d1', borderRadius:6, padding:'4px 8px', fontSize:14}} />
          </div>
        </div>
      )}

      {tab === 'analysis' && (
        <div style={{flex:1, overflowY:'auto', maxWidth:640, margin:'0 auto', width:'100%', padding:'16px', boxSizing:'border-box'}}>
          <div style={{display:'flex', justifyContent:'space-between', gap:16, marginBottom:16}}>
            <div style={{background:'#fff', border:'1px solid #e7e5e4', borderRadius:6, padding:'10px 14px', flex:1, textAlign:'center'}}>
              <div style={{fontSize:11, color:'#a8a29e'}}>{displayName} הוציא/ה החודש</div>
              <div className="mono" style={{fontWeight:700, color:'#C1440E'}}>₪{fmt(spendByPerson[displayName] || 0)}</div>
            </div>
            {Object.keys(spendByPerson).filter(p => p !== displayName).map(p => (
              <div key={p} style={{background:'#fff', border:'1px solid #e7e5e4', borderRadius:6, padding:'10px 14px', flex:1, textAlign:'center'}}>
                <div style={{fontSize:11, color:'#a8a29e'}}>{p} הוציא/ה החודש</div>
                <div className="mono" style={{fontWeight:700, color:'#C1440E'}}>₪{fmt(spendByPerson[p] || 0)}</div>
              </div>
            ))}
          </div>

          <h2 style={{fontSize:13, fontWeight:600, color:'#78716c', marginBottom:8, textTransform:'uppercase', letterSpacing:0.5}}>הכנסות מול הוצאות, 6 חודשים אחרונים</h2>
          <div style={{background:'#fff', border:'1px solid #e7e5e4', borderRadius:6, padding:12, marginBottom:20}}>
            <canvas ref={monthlyChartRef} height="200"></canvas>
          </div>

          <h2 style={{fontSize:13, fontWeight:600, color:'#78716c', marginBottom:8, textTransform:'uppercase', letterSpacing:0.5}}>פילוח הוצאות לפי קטגוריה, {month.slice(5)}/{month.slice(0,4)}</h2>
          <div style={{background:'#fff', border:'1px solid #e7e5e4', borderRadius:6, padding:12}}>
            {Object.keys(spentByCategory).length === 0
              ? <p style={{fontSize:14, color:'#a8a29e', textAlign:'center', padding:'16px 0'}}>אין הוצאות בחודש זה</p>
              : <canvas ref={categoryChartRef} height="220"></canvas>}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  }
</script>
</body>
</html>
