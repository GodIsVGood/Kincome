<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ייבוא היסטוריה מוואטסאפ</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background:#f5f4f0; margin:0; padding:24px; color:#292524; }
  .card { background:#fff; border:1px solid #d6d3d1; border-radius:8px; padding:20px; max-width:480px; margin:0 auto; }
  button { background:#1C2541; color:#fff; border:none; border-radius:6px; padding:10px 20px; font-size:15px; cursor:pointer; }
  button:disabled { background:#a8a29e; }
  .warn { color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:6px; padding:8px 12px; font-size:13px; margin-top:12px; }
  .ok { color:#0B6E4F; }
  #log { font-size:12px; color:#78716c; margin-top:12px; white-space:pre-wrap; max-height:200px; overflow-y:auto; }
</style>
</head>
<body>
<div class="card">
  <h2 style="color:#1C2541; margin-top:0;">ייבוא היסטוריית וואטסאפ</h2>
  <p id="count">טוען...</p>
  <p style="font-size:13px; color:#78716c;">זהו כלי ייבוא חד-פעמי. אחרי שהייבוא יסתיים בהצלחה, אפשר למחוק את הדף הזה מהריפו.</p>
  <button id="go" disabled>ייבא עכשיו</button>
  <div id="status"></div>
  <div id="log"></div>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBvFzm3YnSZgimvsFWzT3sM7Lg2kxguCao",
  authDomain: "kess-income.firebaseapp.com",
  projectId: "kess-income",
  storageBucket: "kess-income.firebasestorage.app",
  messagingSenderId: "802375702998",
  appId: "1:802375702998:web:2eedaa18d55e5a7f812c77"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const countEl = document.getElementById('count');
const goBtn = document.getElementById('go');
function log(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

let DATA = [];

fetch('import-data.json').then(r => r.json()).then(data => {
  DATA = data;
  countEl.textContent = `נמצאו ${DATA.length} תנועות מוכנות לייבוא (מ-${DATA[0].date} עד ${DATA[DATA.length-1].date}).`;
  goBtn.disabled = false;
}).catch(err => {
  countEl.textContent = 'שגיאה בטעינת קובץ הנתונים: ' + err.message;
});

goBtn.addEventListener('click', async () => {
  goBtn.disabled = true;
  statusEl.innerHTML = '';
  const marker = await db.collection('config').doc('import-status').get();
  if (marker.exists && marker.data().imported) {
    if (!confirm('נראה שכבר בוצע ייבוא בעבר. לייבא שוב בכל זאת? (זה ייצור כפילויות)')) {
      goBtn.disabled = false;
      return;
    }
  }
  const chunkSize = 400;
  let done = 0;
  try {
    for (let i = 0; i < DATA.length; i += chunkSize) {
      const chunk = DATA.slice(i, i + chunkSize);
      const batch = db.batch();
      chunk.forEach(t => {
        const ref = db.collection('transactions').doc();
        batch.set(ref, t);
      });
      await batch.commit();
      done += chunk.length;
      log(`נכתבו ${done} / ${DATA.length}`);
    }
    await db.collection('config').doc('import-status').set({ imported: true, count: DATA.length, importedAt: Date.now() });
    statusEl.innerHTML = '<p class="ok">הייבוא הסתיים בהצלחה!</p>';
  } catch (err) {
    statusEl.innerHTML = '<p class="warn">שגיאה: ' + err.message + '</p>';
  }
  goBtn.disabled = false;
});
</script>
</body>
</html>
